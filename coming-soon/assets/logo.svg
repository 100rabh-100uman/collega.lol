<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900">
    <!-- COLLEGA wordmark with tracking -->
    <text x="2" y="58" font-size="52" letter-spacing="4.5" fill="url(#brandGradient)">COLLEGA</text>
    
    <!-- .LOL accent -->
    <text x="358" y="58" font-size="52" letter-spacing="3" fill="url(#lolGradient)" filter="url(#logoGlow)">.LOL</text>
  </g>
</svg>
