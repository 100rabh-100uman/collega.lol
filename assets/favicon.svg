<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Dark modern background container -->
  <rect width="64" height="64" rx="16" fill="#09090D"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#22222E" stroke-width="1.5"/>

  <!-- Minimalist C monogram representing campus / collegiate connection -->
  <path d="M 41 22 C 37 17 26 17 21 22 C 15 28 15 36 21 42 C 26 47 37 47 41 42" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing accent spark dot representing .LOL & student connection -->
  <circle cx="43" cy="22" r="3.5" fill="url(#glowGrad)" filter="url(#subtleGlow)"/>
</svg>
